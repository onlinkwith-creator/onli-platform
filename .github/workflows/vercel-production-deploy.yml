name: Vercel Auto Deploy

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: vercel-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Resolve Vercel project settings
        if: env.VERCEL_TOKEN != ''
        run: |
          ORG_ID="${VERCEL_ORG_ID}"
          PROJECT_ID="${VERCEL_PROJECT_ID}"

          if [ -f ".vercel/project.json" ]; then
            ORG_ID="${ORG_ID:-$(node -e "const p=require('./.vercel/project.json'); console.log(p.orgId || '')")}"
            PROJECT_ID="${PROJECT_ID:-$(node -e "const p=require('./.vercel/project.json'); console.log(p.projectId || '')")}"
          fi

          echo "VERCEL_ORG_ID=${ORG_ID}" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Skip when Vercel secrets are missing
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "Skipping GitHub Actions Vercel deploy because Vercel secrets are not fully configured. Vercel Git integration will handle deployment."

      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
          else
            vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"
          fi

      - name: Build Vercel artifact
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel build --prod --token="${VERCEL_TOKEN}"
          else
            vercel build --token="${VERCEL_TOKEN}"
          fi

      - name: Deploy Vercel artifact
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
          else
            vercel deploy --prebuilt --token="${VERCEL_TOKEN}"
          fi
