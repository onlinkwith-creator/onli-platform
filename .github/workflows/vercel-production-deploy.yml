name: Vercel Auto Deploy

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: vercel-auto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_iEUcuBD7P0uj898EBwc0eEuQ' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_WJEelnBUTTsH7fip0nKAKrE4h9K6' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel token
        id: vercel-auth
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Skipping GitHub Actions Vercel deploy because VERCEL_TOKEN is not configured. Vercel Git integration will handle deployment."
            exit 0
          fi

          if vercel whoami --token="${VERCEL_TOKEN}" >/dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Skipping GitHub Actions Vercel deploy because VERCEL_TOKEN is invalid. Vercel Git integration will handle deployment."
          fi

      - name: Skip when Vercel project settings are missing
        if: steps.vercel-auth.outputs.valid == 'true' && (env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '')
        run: echo "Skipping GitHub Actions Vercel deploy because Vercel project settings are not fully configured. Vercel Git integration will handle deployment."

      - name: Pull Vercel environment
        if: steps.vercel-auth.outputs.valid == 'true' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
          else
            vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"
          fi

      - name: Build Vercel artifact
        if: steps.vercel-auth.outputs.valid == 'true' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel build --prod --token="${VERCEL_TOKEN}"
          else
            vercel build --token="${VERCEL_TOKEN}"
          fi

      - name: Deploy Vercel artifact
        if: steps.vercel-auth.outputs.valid == 'true' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
          else
            vercel deploy --prebuilt --token="${VERCEL_TOKEN}"
          fi
